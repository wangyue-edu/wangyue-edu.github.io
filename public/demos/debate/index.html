<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- 上述3个meta标签*必须*放在最前面，任何其他内容都*必须*跟随其后！ -->
    <meta name="description" content="">
    <meta name="author" content="">

    <title>报名系统</title>

    <!-- Bootstrap core CSS -->
    <link href="https://cdn.bootcss.com/bootstrap/3.3.7/css/bootstrap.min.css" rel="stylesheet">

    <!-- IE10 viewport hack for Surface/desktop Windows 8 bug -->
    <link href="{{__HOST__}}/public/css/ie10.css" rel="stylesheet">

    <!-- Custom styles for this template -->
    <link href="{{__HOST__}}/public/css/signin.css" rel="stylesheet">

    <!-- HTML5 shim and Respond.js for IE8 support of HTML5 elements and media queries -->
    <!--[if lt IE 9]>
      <script src="https://cdn.bootcss.com/html5shiv/3.7.3/html5shiv.min.js"></script>
      <script src="https://cdn.bootcss.com/respond.js/1.4.2/respond.min.js"></script>
    <![endif]-->
    <link href="{{__HOST__}}/index/index.css" rel="stylesheet">
</head>

<body>

    <div class="container">

        <form class="form-signin form-horizontal" action="{{__HOST__}}/search" method="post">
            <div class="form-group">
                <h2 class="form-signin-heading header">报名系统</h2>
            </div>

            <!--下拉列表-->
            <div class="form-group">
                <label class="col-sm-4 control-label">选择学校</label>
                <div class="col-sm-8">
                    <select class="form-control form-control-static" name="school">
                        <option>南通中学</option>
                        <option>南通市第一中学</option>
                        <option>通大附中</option>
                        <option>南通市第二中学</option>
                    </select>
                </div>
            </div>


            <div class="form-group">
                <label class="col-sm-4 control-label">姓&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;名</label>
                <div class="col-sm-8">
                    <input type="text" id="username" class="form-control" name="username" placeholder="姓名" required>
                </div>
            </div>
            <!--胸卡-->
            <div class="form-group">
                <label class="col-sm-4 control-label">胸&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;卡</label>
                <div class="col-sm-8">
                    <input type="text" id="
                    " class="form-control" name="password" placeholder="胸卡号" required>
                </div>
            </div>

            <div class="form-group">
                <button class="btn btn-lg btn-primary btn-block" type="submit">提交</button>
            </div>

        </form>


        <h2 class="form-signin code">
            {{if list}}
               你的验证码：{{list}}
            {{else}}
               {{error}}
            {{/if}}

        </h2>
    </div> <!-- /container -->




    <!-- IE10 viewport hack for Surface/desktop Windows 8 bug -->
    <script src="{{__HOST__}}/public/js/ie10.js"></script>

</body>

</html>
