<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <linearGradient id="peak" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0E7FF" />
    </linearGradient>
    <linearGradient id="snow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>
  </defs>

  <!-- Rounded Background Container -->
  <rect width="128" height="128" rx="28" fill="url(#bg)" />

  <!-- Mountain Peak 1 (Back / Right) -->
  <polygon points="76,46 108,98 44,98" fill="url(#snow)" opacity="0.85" />
  
  <!-- Mountain Peak 2 (Foreground / Main / Left) -->
  <polygon points="50,30 92,98 8,98" fill="url(#peak)" />

  <!-- Snowcap on Main Peak -->
  <polygon points="50,30 63,52 54,48 48,53 37,50" fill="#FFFFFF" />

  <!-- Summit Star / Sparkle Accent -->
  <circle cx="50" cy="24" r="3.5" fill="#FCD34D" />
</svg>
